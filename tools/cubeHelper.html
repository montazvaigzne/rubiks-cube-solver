<!DOCTYPE html>
<!--
    DISCLAIMER:
    This 3D Cube Visualizer was generated by AI as a visualization aid.
    It is NOT part of the core application logic.
    Its sole purpose is to help the developer and reviewers understand the mapping
    of the 0-53 integer indices to the physical 3D locations on the Rubik's Cube.
    You can open this file in any web browser to rotate the cube and inspect the indices.
-->
<html>
<head>
    <title>Rubika kuba 3D izklājums</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>
    <script type="module">
                import * as THREE from 'three';
                import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(6, 6, 6);

                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);

                const controls = new OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;

                scene.add(new THREE.AmbientLight(0xffffff, 1));

                const coreGeo = new THREE.BoxGeometry(3, 3, 3);
                const coreMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
                scene.add(new THREE.Mesh(coreGeo, coreMat));

                const colors = [
                    0xffffff, 0xffffff, 0xffffff, 0xffffff, 0xffffff, 0xffffff, 0xffffff, 0xffffff, 0xffffff, // Up
                    0xff0000, 0xff0000, 0xff0000, 0xff0000, 0xff0000, 0xff0000, 0xff0000, 0xff0000, 0xff0000, // Right
                    0x00ff00, 0x00ff00, 0x00ff00, 0x00ff00, 0x00ff00, 0x00ff00, 0x00ff00, 0x00ff00, 0x00ff00, // Front
                    0xffff00, 0xffff00, 0xffff00, 0xffff00, 0xffff00, 0xffff00, 0xffff00, 0xffff00, 0xffff00, // Down
                    0xff4700, 0xff4700, 0xff4700, 0xff4700, 0xff4700, 0xff4700, 0xff4700, 0xff4700, 0xff4700, // Left
                    0x0000ff, 0x0000ff, 0x0000ff, 0x0000ff, 0x0000ff, 0x0000ff, 0x0000ff, 0x0000ff, 0x0000ff  // Back
                ];

                function createTextTexture(text, bgColor) {
                    const canvas = document.createElement('canvas');
                    canvas.width = 128;
                    canvas.height = 128;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = bgColor;
                    ctx.fillRect(0, 0, 128, 128);
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(0, 0, 128, 128);

                    ctx.fillStyle = (bgColor === '#ffffff' || bgColor === '#ffff00') ? '#000000' : '#ffffff';
                    ctx.font = 'bold 50px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(text, 64, 64);

                    const texture = new THREE.CanvasTexture(canvas);
                    return texture;
                }

                const tileSize = 1;
                const offset = 1.5 + (tileSize / 2) + 0.01;

                for (let i = 0; i < 54; i++) {
                    const faceIndex = Math.floor(i / 9);
                    const faceletIndex = i % 9;

                    const row = Math.floor(faceletIndex / 3);
                    const col = faceletIndex % 3;

                    const hexColor = '#' + colors[i].toString(16).padStart(6, '0');
                    const texture = createTextTexture(i.toString(), hexColor);
                    const mat = new THREE.MeshBasicMaterial({ map: texture });
                    const geo = new THREE.PlaneGeometry(tileSize, tileSize);
                    const tile = new THREE.Mesh(geo, mat);

                    if (faceIndex === 0) { // UP
                        tile.position.set(col - 1, offset, row - 1);
                        tile.rotation.x = -Math.PI / 2;
                    }
                    else if (faceIndex === 1) { // RIGHT
                        tile.position.set(offset, 1 - row, 1 - col);
                        tile.rotation.y = Math.PI / 2;
                    }
                    else if (faceIndex === 2) { // FRONT
                        tile.position.set(col - 1, 1 - row, offset);
                    }
                    else if (faceIndex === 3) { // DOWN
                        tile.position.set(col - 1, -offset, 1 - row);
                        tile.rotation.x = Math.PI / 2;
                        tile.rotation.z = Math.PI;
                    }
                    else if (faceIndex === 4) { // LEFT
                        tile.position.set(-offset, 1 - row, col - 1);
                        tile.rotation.y = -Math.PI / 2;
                    }
                    else if (faceIndex === 5) { // BACK (Izlabots: 45 būs kreisajā pusē, 47 labajā)
                        tile.position.set(1 - col, 1 - row, -offset);
                        tile.rotation.y = Math.PI;
                    }

                    scene.add(tile);
                }

                function animate() {
                    requestAnimationFrame(animate);
                    controls.update();
                    renderer.render(scene, camera);
                }
                animate();
    </script>
</body>
</html>
